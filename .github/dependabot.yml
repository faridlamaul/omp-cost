version: 2

# Go module updates change the released binaries, so they use fix(deps) and
# merging them publishes a patch release. Workflow updates (actions and the
# ci-template reusable workflows) use ci(deps) and release nothing.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
