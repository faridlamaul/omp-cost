name: Release

# Every push to main runs CI, then shiptag (through ci-template) derives the
# next version from the Conventional Commits since the last tag. Commits that
# warrant no release (docs, ci, chore, ...) tag nothing and build nothing.
# Everything runs in one workflow because tags created with GITHUB_TOKEN do not
# trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  semantic:
    needs: ci
    permissions:
      contents: write
    uses: faridlamaul/ci-template/.github/workflows/semantic-release.yml@77397896441e82e3355760558f33b17fff605805 # v1.0.0
    with:
      bump: auto
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  binary:
    needs: semantic
    if: needs.semantic.outputs.released == 'true'
    permissions:
      contents: write
    uses: faridlamaul/ci-template/.github/workflows/go-release.yml@77397896441e82e3355760558f33b17fff605805 # v1.0.0
    with:
      version: ${{ needs.semantic.outputs.version }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
