name: Release

# Every push to main runs CI, then shipguard release: shiptag derives the next
# version from the Conventional Commits since the last tag, GoReleaser builds
# the archives and signs checksums.txt (cosign keyless), and the workflow
# attests the archives with GitHub build provenance. Commits that warrant no
# release (docs, ci, chore, ...) tag nothing and build nothing. Everything runs
# in one workflow because tags created with GITHUB_TOKEN do not trigger other
# workflows.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: faridlamaul/shipguard/.github/workflows/release-artifacts.yml@9044e94ed35f6116d99a667cbbfce5f8e7f6ed9d # v1.4.0
    with:
      steps: version binaries
      shipguard-version: v1.4.0
