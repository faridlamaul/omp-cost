name: CI

# Runs on pull requests; pushes to main run it through release.yml before
# releasing.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go-ci:
    # shipguard ci detects Go from go.mod, lints with golangci-lint (standard
    # linters, see .golangci.yml), runs the tests with -race through gotestsum
    # (JUnit and coverage are uploaded as the shipguard-ci artifact) and
    # builds ./... .
    uses: faridlamaul/shipguard/.github/workflows/build-test.yml@9044e94ed35f6116d99a667cbbfce5f8e7f6ed9d # v1.4.0
    with:
      steps: lint test build
