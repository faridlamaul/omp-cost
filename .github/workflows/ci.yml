name: CI

# Runs on pull requests; pushes to main run it through release.yml before
# releasing.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go-ci:
    uses: faridlamaul/ci-template/.github/workflows/go-ci.yml@main
    with:
      go_version: "stable"
      run_lint: false # can enable once golangci-lint is configured in repo
      run_tests: true
      run_build: true
      build_output: "bin/omp-cost"
      build_package: "./cmd/omp-cost"
