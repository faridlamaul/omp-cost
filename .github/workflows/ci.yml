name: CI

# Runs on pull requests; pushes to main run it through release.yml before
# releasing.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go-ci:
    # shipguard ci detects Go from go.mod, runs the tests with -race through
    # gotestsum (JUnit and coverage are uploaded as the shipguard-ci artifact)
    # and builds ./... . Lint stays off until the golangci-lint findings are
    # fixed: add "lint" to steps then.
    uses: faridlamaul/shipguard/.github/workflows/build-test.yml@6d32599d46058d7d8545af58b22f227e2fefccde # v1.3.0
    with:
      steps: test build
