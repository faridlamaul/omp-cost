name: Semantic Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "assets/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
        required: true
      dry_run:
        description: "Dry-run (do not create tag/release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: faridlamaul/ci-template/.github/workflows/semantic-release.yml@main
    with:
      bump: ${{ inputs.bump || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
